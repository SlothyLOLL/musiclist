<meta charset="UTF-8">

<title>Brian's Favorite Songs</title>
<style>
  :root {
    --bg: #05070d;
    --panel: #0d121c;
    --panel-2: #141b29;
    --border: #1f2a40;
    --text: #e6eeff;
    --muted: #8a9bbd;
    --accent: #4da3ff;
    --accent-2: #1f6feb;
    --spotify: #1db954;
    --danger: #ff6b8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #0b2147 0%, var(--bg) 55%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { margin: 0; font-size: 2rem; }
  header h1 span { color: var(--accent); }
  header p { margin: 6px 0 0; color: var(--muted); }

  .grid { display: grid; grid-template-columns: 3fr 2fr; gap: 18px; align-items: start; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }

  .box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .box h2 { margin: 0 0 4px; font-size: 1.15rem; }
  .box .sub { color: var(--muted); font-size: .9rem; margin-bottom: 12px; }
  .stack { display: flex; flex-direction: column; gap: 18px; }

  input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font: inherit;
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  form { display: flex; flex-direction: column; gap: 10px; }
  button {
    font: inherit; border: none; border-radius: 8px; padding: 10px 14px;
    cursor: pointer; background: var(--accent-2); color: white; font-weight: 600;
  }
  button:hover { background: var(--accent); }
  .status { color: var(--muted); font-size: .85rem; min-height: 1.2em; text-align: center; }

  .list { max-height: 70vh; overflow-y: auto; margin-top: 10px; }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 6px; border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .num { color: var(--muted); width: 2.2em; text-align: right; font-size: .85rem; flex-shrink: 0; }
  .info { flex: 1; min-width: 0; }
  .title { font-weight: 600; overflow-wrap: anywhere; }
  .artist { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
  .from { color: var(--accent); font-size: .8rem; }
  a.play {
    flex-shrink: 0; text-decoration: none; background: var(--spotify); color: #06120a;
    font-weight: 700; font-size: .85rem; padding: 7px 12px; border-radius: 999px;
  }
  a.play:hover { filter: brightness(1.1); }
  .x {
    flex-shrink: 0; background: transparent; color: var(--muted); border: 1px solid var(--border);
    padding: 5px 9px; font-size: .8rem;
  }
  .x:hover { background: transparent; color: var(--danger); border-color: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 24px 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Brian's <span>Favorite Songs</span></h1>
  </header>

  <div class="grid">
    <section class="box">
      <h2>My Songs <span class="sub" id="myCount"></span></h2>
      <input id="search" placeholder="Search by song or singer…">
      <div class="list" id="myList"></div>
    </section>

    <div class="stack">
      <section class="box">
        <h2>Recommend me a song</h2>
        <div class="sub">Tell me a song and I'll check it out</div>
        <form id="recForm">
          <input id="recTitle" placeholder="Song" required>
          <input id="recArtist" placeholder="Singer" required>
          <button type="submit">Submit</button>
        </form>
        <div class="status" id="status"></div>
      </section>

      <section class="box">
        <h2>Recommended to Me <span class="sub" id="recCount"></span></h2>
        <div class="list" id="recList"><div class="empty">Loading…</div></div>
      </section>
    </div>
  </div>
</div>

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const spotifyFor = (title, artist, url) =>
    url || `https://open.spotify.com/search/${encodeURIComponent(title + " " + artist)}`;

  // ---- My Songs (built into the page) ----
  function renderMine() {
    const q = $("search").value.trim().toLowerCase();
    const rows = MY_SONGS
      .map((s, i) => ({ title: s[0], artist: s[1], url: s[2] || "", n: i + 1 }))
      .filter(s => !q || (s.title + " " + s.artist).toLowerCase().includes(q));
    $("myCount").textContent = `(${MY_SONGS.length})`;
    $("myList").innerHTML = rows.length ? rows.map(s => `
      <div class="row">
        <div class="num">${s.n}</div>
        <div class="info">
          <div class="title">${esc(s.title)}</div>
          <div class="artist">${esc(s.artist)}</div>
        </div>
        <a class="play" href="${esc(spotifyFor(s.title, s.artist, s.url))}" target="_blank" rel="noopener">▶ Spotify</a>
      </div>`).join("") : `<div class="empty">No songs match that.</div>`;
  }
  $("search").addEventListener("input", renderMine);
  renderMine();

  // ---- Recommended to Me (shared through Firebase) ----
  const db = getFirestore(initializeApp(firebaseConfig));
  const recRef = collection(db, "recommendations");

  function setStatus(msg) {
    $("status").textContent = msg;
    setTimeout(() => { if ($("status").textContent === msg) $("status").textContent = ""; }, 3500);
  }

  $("recForm").addEventListener("submit", async e => {
    e.preventDefault();
    try {
      await addDoc(recRef, {
        title: $("recTitle").value.trim(),
        artist: $("recArtist").value.trim(),
        createdAt: serverTimestamp()
      });
      ["recTitle", "recArtist"].forEach(id => $(id).value = "");
      setStatus("Sent! 🎶");
    } catch (err) {
      console.error(err);
      setStatus("Couldn't send — try again in a sec.");
    }
  });

  let recs = [];
  function renderRecs() {
    $("recCount").textContent = `(${recs.length})`;
    $("recList").innerHTML = recs.length ? recs.map(r => `
      <div class="row">
        <div class="info">
          <div class="title">${esc(r.title)}</div>
          <div class="artist">${esc(r.artist)}</div>
          ${r.from ? `<div class="from">from ${esc(r.from)}</div>` : ""}
        </div>
        <a class="play" href="${esc(spotifyFor(r.title, r.artist, r.url))}" target="_blank" rel="noopener">▶ Spotify</a>
        <button class="x" data-id="${r.id}" title="Remove">✕</button>
      </div>`).join("") : `<div class="empty">No recommendations yet.</div>`;
  }
  $("recList").addEventListener("click", async e => {
    const b = e.target.closest("button.x");
    if (!b) return;
    const r = recs.find(x => x.id === b.dataset.id);
    if (r && confirm(`Remove "${r.title}"?`)) await deleteDoc(doc(db, "recommendations", r.id));
  });

  onSnapshot(query(recRef, orderBy("createdAt", "desc")), snap => {
    recs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderRecs();
  }, err => {
    console.error(err);
    $("recList").innerHTML = `<div class="empty">Couldn't load — check the Firestore rules.</div>`;
  });
</script>
