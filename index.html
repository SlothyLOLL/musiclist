<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purple Hour Music</title>
<style>
  :root {
    --bg: #05070d;
    --panel: #0d121c;
    --panel-2: #141b29;
    --border: #1f2a40;
    --text: #e6eeff;
    --muted: #8a9bbd;
    --accent: #4da3ff;
    --accent-2: #1f6feb;
    --danger: #ff6b8a;
    --spotify: #1db954;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #0b2147 0%, var(--bg) 55%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { margin: 0; font-size: 2rem; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  header p { margin: 6px 0 0; color: var(--muted); }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 18px;
  }
  .card h2 { margin: 0 0 12px; font-size: 1.1rem; }

  form.add { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  form.add .full { grid-column: 1 / -1; }
  input, select, textarea {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }

  button {
    font: inherit;
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    background: var(--accent-2);
    color: white;
    font-weight: 600;
  }
  button:hover { background: var(--accent); }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); font-weight: 500; }
  button.ghost:hover { border-color: var(--accent); color: var(--text); }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }

  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs button { flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--muted); }
  .tabs button.active { background: var(--accent-2); color: white; border-color: var(--accent-2); }
  .count { opacity: .8; font-weight: 400; }

  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .filters input { flex: 2; min-width: 180px; }
  .filters select { flex: 1; min-width: 140px; }

  .song {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .song-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .song h3 { margin: 0; font-size: 1.05rem; }
  .song .artist { color: var(--muted); margin-top: 2px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tag { font-size: .78rem; padding: 3px 9px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); }
  .tag.genre { color: var(--accent); border-color: var(--accent-2); }
  .note { margin: 10px 0 0; color: var(--text); opacity: .9; font-size: .95rem; white-space: pre-wrap; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .actions button, .actions a { padding: 7px 11px; font-size: .88rem; }
  a.spotify {
    display: inline-block; text-decoration: none; border-radius: 8px;
    background: var(--spotify); color: #0b0b0b; font-weight: 700;
  }
  .player { margin-top: 12px; }
  .player iframe { width: 100%; border: 0; border-radius: 12px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .status { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 8px; min-height: 1.2em; }

  @media (max-width: 600px) {
    form.add { grid-template-columns: 1fr; }
    .song-top { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Purple Hour <span>Music</span></h1>
    <p>Songs we're putting each other on to</p>
  </header>

  <section class="card">
    <h2>Add a song</h2>
    <form class="add" id="addForm">
      <input id="title" placeholder="Song title" required>
      <input id="artist" placeholder="Artist" required>
      <select id="genre" required>
        <option value="">Genre…</option>
      </select>
      <select id="section">
        <option value="recommended">Recommended</option>
        <option value="favorites">Favorites</option>
      </select>
      <input id="addedBy" placeholder="From (your name)" required>
      <input id="spotify" placeholder="Spotify link (optional)">
      <textarea id="note" class="full" placeholder="Why you like it / when to listen (optional)"></textarea>
      <button class="full" type="submit">Add song</button>
    </form>
    <div class="status" id="status"></div>
    <button class="ghost" id="importBtn" type="button" style="display:none;width:100%;margin-top:8px"></button>
  </section>

  <div class="tabs">
    <button data-tab="recommended" class="active">Recommended <span class="count" id="countRec"></span></button>
    <button data-tab="favorites">Favorites <span class="count" id="countFav"></span></button>
  </div>

  <div class="filters">
    <input id="search" placeholder="Search title, artist, or note…">
    <select id="genreFilter"><option value="">All genres</option></select>
    <select id="fromFilter"><option value="">From anyone</option></select>
  </div>

  <div id="list"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, addDoc, onSnapshot, updateDoc,
    deleteDoc, doc, serverTimestamp, query, orderBy, writeBatch, Timestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ⬇️ Paste the config from your NEW Firebase project here
  const firebaseConfig = {
    apiKey: "AIzaSyCtwRb4ZEl-hhEes70Mv6CVIaLgs7A4Rzo",
    authDomain: "musiclist-54f93.firebaseapp.com",
    projectId: "musiclist-54f93",
    storageBucket: "musiclist-54f93.firebasestorage.app",
    messagingSenderId: "981373067498",
    appId: "1:981373067498:web:ab2c50bd12fb5cdc50f793"
  };

  const GENRES = [
    "Hip-Hop / Rap", "R&B", "Pop", "Rock", "Alternative / Indie", "Metal",
    "Electronic / EDM", "Latin", "Reggaeton", "Regional Mexicano", "K-Pop",
    "J-Pop / Anime", "Jazz", "Soul / Funk", "Country", "Lo-fi", "Classical",
    "Soundtrack", "Other"
  ];

  // Brian's "Favorite Songs" Apple Music playlist (duplicates removed) — [title, artist]
  const STARTER_SONGS = [["Black Friday","Tom Odell"],["When I Close My Eyes","Tom Odell"],["passenger side","Marin Clarisse"],["grace","Marin Clarisse"],["PIXELATED KISSES","Joji"],["Me Convertí","Peso Pluma"],["A Little Death","The Neighbourhood"],["Let Down","Radiohead"],["BIPOLAR","Peso Pluma, Jasiel Nuñez, Junior H"],["daño","Peso Pluma, Tito Double P"],["The Night Begins to Shine","B.E.R."],["Twist Made Me","Lil Wayne"],["Sorry 4 The Wait","Lil Wayne"],["K","Eslabon Armado"],["Que Te Vas","T3r Elemento"],["Mil Problemas","Nsqk, Eslabon Armado"],["Deep","Peter Sandberg"],["Who Knows","Daniel Caesar"],["What If I Call","Alex Crichton"],["Doma","Jósean Log"],["Poster Child","Khantrast"],["Te Estoy Correteando","LATIN MAFIA, Fred again.."],["Herida Abierta","Ivan Cornejo"],["Ya Te Perdí (Deluxe)","Ivan Cornejo"],["Tatuajes (Deluxe)","Ivan Cornejo"],["Me Hiciste un Loco (Deluxe)","Ivan Cornejo"],["Aquí Te Espero","Ivan Cornejo"],["Mirada","Ivan Cornejo"],["Best Part (feat. H.E.R.)","Daniel Caesar"],["Reputation","Stephen Dawes"],["OJITOS PERSAS","Eslabon Armado, ERRE"],["Otra Noche de Llorar","Mon Laferte"],["EN ALTAVOZ","Grupo Frontera, Junior H"],["Qué Fuimos","Banda MS de Sergio Lizárraga"],["Carnal","Grupo RYE"],["Stop The Wedding!","Ashe"],["Back Home","Yeat, Joji"],["UNETHICAL","Faouzia"],["Too Little, Too Late","Laufey"],["J.","Ivan Cornejo"],["Lo Que Siento","Cuco"],["seasons","wave to earth"],["As It Was","Harry Styles"],["LUNA","Peso Pluma, Junior H"],["Coming Up Roses","Harry Styles"],["Saturn","Sleeping At Last"],["Llévame Despacio","Paulina Goto"],["love.","wave to earth"],["Oceans (feat. Frank Ocean)","JAŸ-Z"],["Chasing Cars","Sleeping At Last"],["Turning Page","Sleeping At Last"],["Born to Die","Lana Del Rey"],["Baptized In Fear","The Weeknd"],["Promise","Laufey"],["En Peligro de Extinción","La Adictiva"],["Let You Break My Heart Again","Laufey, Philharmonia Orchestra"],["drivers license","Olivia Rodrigo"],["Cry","Cigarettes After Sex"],["Apocalypse","Cigarettes After Sex"],["cardigan","Taylor Swift"],["La Boda","Camilo"],["The Winner Takes It All","Meryl Streep"],["Me Prometí","Ivan Cornejo"],["Help","Big Time Rush"],["Willing and Able","Noah Kahan"],["Orbiter","Noah Kahan"],["back to friends","sombr"],["MAYBE.","SIENNA SPIRO"],["Die On This Hill","SIENNA SPIRO"],["Great Expectation","SIENNA SPIRO"],["butterflies.","Brent Faiyaz"],["Lo Que Hay X Aquí","La Receta"],["oh yeah?","Steve Lacy"],["Loser","Tame Impala"],["golden hour","JVKE"],["the cure","Olivia Rodrigo"],["Those Eyes","New West"],["Perro Abandonado","Ivan Cornejo"],["Está Dañada","Ivan Cornejo"],["HASTA LA MUERTE","Eslabon Armado, Ivan Cornejo"],["Glimpse of Us","Joji"],["Creep","Radiohead"],["The Scientist","Coldplay"],["New Flame (feat. Usher & Rick Ross)","Chris Brown"],["Sign of the Times","Harry Styles"],["Halo","Beyoncé"],["QUÉ DIABLOS HICE (INTERLUDE)","Eslabon Armado"],["Amorfoda","Bad Bunny"],["Young Girls","Bruno Mars"],["Hasta la Raíz","Natalia Lafourcade"],["Soy Peor","Bad Bunny"],["Sparks","Coldplay"],["hope ur ok","Olivia Rodrigo"],["She Used to Be Mine","Sara Bareilles"],["Oye Mujer","Raymix"],["Secrets (2026 Remastered)","OneRepublic"],["Just a Dream","Nelly"],["SLOW DANCING IN THE DARK","Joji"],["Holy Grail (feat. Justin Timberlake)","JAŸ-Z"],["The Hills","The Weeknd"],["El Perdedor (feat. Marco Antonio Solís)","Enrique Iglesias"],["Locked Out of Heaven","Bruno Mars"],["Hold On, We're Going Home (feat. Majid Jordan)","Drake"],["purple","Olivia Rodrigo"],["Vuelve","Ivan Cornejo"],["AMIGOS CON DERECHOS","Eslabon Armado, Peso Pluma"],["Space Bound","Eminem"],["First And Last","4BOUT"],["My Way","Frank Sinatra"],["Bubalú (feat. Becky G & Prince Royce)","DJ Luian, Mambo Kingz, Anuel AA"],["Que Te Costó","Yahritza Y Su Esencia"],["How I Get","Laufey"],["BELLAKEO","Peso Pluma, Anitta"],["No Es Mentira (Version Norteña)","Los Primos Del Este"],["PERDIENDO","Saul Villarreal"],["No Te Hagas","Jory Boy, Bad Bunny"],["Mi complemento","Peint"],["ME PORTO BONITO","Los Gemelos De Sinaloa"],["Dance with the Devil","Immortal Technique"],["En Privado","Xavi, Manuel Turizo"],["Lover Is a Day","Cuco"],["It's Time","Imagine Dragons"],["NO VOY A JUGAR","Eslabon Armado"],["everything works out in the end (slowed + best part looped)","core²"],["Apparently","J. Cole"],["SPEECHLESS","WESLEYFRANKLIN"],["Se Logró","Fuerza Regida"],["ESTADO MENTAL (OUTRO)","Eslabon Armado"],["Whatever You Like","T.I."],["Promise (feat. Usher)","Romeo Santos"],["Wet Dreamz","J. Cole"],["I Need a Doctor (feat. Eminem & Skylar Grey)","Dr. Dre"],["Amor Completo","Mon Laferte"],["Modo DND","Xavi, Tony Aguirre"],["Super Bass","Nicki Minaj"],["Can't Feel My Face","The Weeknd"],["Tu Boda","Oscar Maydon, Fuerza Regida"],["BABY I'M BACK","The Kid LAROI"],["Sale Para Ser Feliz","Ivan Cornejo"],["Video Games (Remastered)","Lana Del Rey"],["Atención","Ivan Cornejo"],["Story of My Life","One Direction"],["Like Toy Soldiers","Eminem"],["Drop the World (feat. Eminem)","Lil Wayne"],["Happiness","Rex Orange County"],["Yellow","Coldplay"],["Might Be","Anderson .Paak"],["Forever Star(《偷偷藏不住》电视剧插曲)","Yi Hao Zhang"],["RELOJ","Peso Pluma, Ivan Cornejo"],["WILDFLOWER","Billie Eilish"],["Mine","Bazzi"],["Baby Please","Ivan Cornejo"],["No Me Doy por Vencido","Luis Fonsi"],["Stop Crying Your Heart Out","Oasis"],["FE!N (feat. Playboi Carti)","Travis Scott"],["Rompe La Dompe","Peso Pluma, Junior H, Oscar Maydon"],["Goddess","Laufey"],["MODO DEPRE :(","Eslabon Armado"],["Forever","Drake, Kanye West, Lil Wayne, Eminem"],["EXCESOS","Fuerza Regida"],["Háblame De Ti","Banda MS de Sergio Lizárraga"],["After Hours","The Weeknd"],["UNA CERVEZA","Fuerza Regida, Manuel Turizo"],["Regalo De Dios","Julión Álvarez y su Norteño Banda"],["Tomando Tequila","Eslabon Armado, JHAYCO"],["Locura","Saul Villarreal"],["PATRAS (with Yahritza Y Su Esencia)","Becky G"],["Otra Noche","Los Ángeles Azules, NICKI NICOLE"],["La Difícil","Bad Bunny"],["Edge of the Dark","Armon Jay"],["Back in Blood (feat. Lil Durk)","Pooh Shiesty"]];

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const songsRef = collection(db, "songs");

  const $ = id => document.getElementById(id);
  let songs = [];
  let currentTab = "recommended";
  const openPlayers = new Set();

  // Fill genre dropdowns
  for (const g of GENRES) {
    $("genre").append(new Option(g, g));
    $("genreFilter").append(new Option(g, g));
  }

  // Remember your name on this device
  try { $("addedBy").value = localStorage.getItem("ph_music_name") || ""; } catch {}

  function setStatus(msg) {
    $("status").textContent = msg;
    if (msg) setTimeout(() => { if ($("status").textContent === msg) $("status").textContent = ""; }, 3000);
  }

  // Turns a Spotify link into an embeddable player URL
  function spotifyEmbed(url) {
    const m = (url || "").match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|album|playlist|episode)\/([A-Za-z0-9]+)/);
    return m ? `https://open.spotify.com/embed/${m[1]}/${m[2]}` : null;
  }

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  $("addForm").addEventListener("submit", async e => {
    e.preventDefault();
    const spotify = $("spotify").value.trim();
    if (spotify && !spotifyEmbed(spotify)) {
      setStatus("That doesn't look like a Spotify link — try Share → Copy link in Spotify.");
      return;
    }
    const addedBy = $("addedBy").value.trim();
    try { localStorage.setItem("ph_music_name", addedBy); } catch {}

    try {
      await addDoc(songsRef, {
        title: $("title").value.trim(),
        artist: $("artist").value.trim(),
        genre: $("genre").value,
        section: $("section").value,
        addedBy,
        spotify,
        note: $("note").value.trim(),
        createdAt: serverTimestamp()
      });
      ["title", "artist", "spotify", "note"].forEach(id => $(id).value = "");
      $("genre").value = "";
      setStatus("Added 🎵");
    } catch (err) {
      console.error(err);
      setStatus("Couldn't save — check your Firebase config and rules.");
    }
  });

  document.querySelectorAll(".tabs button").forEach(btn => {
    btn.addEventListener("click", () => {
      currentTab = btn.dataset.tab;
      document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b === btn));
      render();
    });
  });

  ["search", "genreFilter", "fromFilter"].forEach(id => $(id).addEventListener("input", render));

  $("list").addEventListener("click", async e => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    const song = songs.find(s => s.id === id);
    if (!song) return;

    if (btn.dataset.action === "move") {
      const to = song.section === "favorites" ? "recommended" : "favorites";
      await updateDoc(doc(db, "songs", id), { section: to });
    } else if (btn.dataset.action === "delete") {
      if (confirm(`Remove "${song.title}" by ${song.artist}?`)) await deleteDoc(doc(db, "songs", id));
    } else if (btn.dataset.action === "play") {
      openPlayers.has(id) ? openPlayers.delete(id) : openPlayers.add(id);
      render();
    }
  });

  // One-click import of the Apple Music favorites — skips anything already on the list
  const songKey = (t, a) => (t + "|" + a).toLowerCase();
  function missingStarters() {
    const have = new Set(songs.map(s => songKey(s.title, s.artist)));
    return STARTER_SONGS.filter(([t, a]) => !have.has(songKey(t, a)));
  }
  function refreshImportBtn() {
    const n = missingStarters().length;
    $("importBtn").style.display = n ? "block" : "none";
    $("importBtn").textContent = `⤓ Import Brian's Apple Music favorites (${n} songs)`;
  }
  $("importBtn").addEventListener("click", async () => {
    const todo = missingStarters();
    if (!todo.length || !confirm(`Add ${todo.length} songs to Favorites?`)) return;
    $("importBtn").disabled = true;
    try {
      const batch = writeBatch(db);
      const now = Date.now();
      todo.forEach(([title, artist], i) => {
        batch.set(doc(songsRef), {
          title, artist, genre: "", section: "favorites", addedBy: "Brian",
          spotify: "", note: "",
          createdAt: Timestamp.fromMillis(now - i) // keeps playlist order
        });
      });
      await batch.commit();
      setStatus(`Imported ${todo.length} songs 🎶`);
    } catch (err) {
      console.error(err);
      setStatus("Import failed — check your Firestore rules.");
    }
    $("importBtn").disabled = false;
  });

  function refreshFromFilter() {
    const sel = $("fromFilter");
    const current = sel.value;
    const names = [...new Set(songs.map(s => s.addedBy).filter(Boolean))].sort();
    sel.innerHTML = '<option value="">From anyone</option>';
    names.forEach(n => sel.append(new Option(n, n)));
    sel.value = names.includes(current) ? current : "";
  }

  function render() {
    const q = $("search").value.trim().toLowerCase();
    const genre = $("genreFilter").value;
    const from = $("fromFilter").value;

    $("countRec").textContent = `(${songs.filter(s => s.section === "recommended").length})`;
    $("countFav").textContent = `(${songs.filter(s => s.section === "favorites").length})`;

    const shown = songs.filter(s =>
      s.section === currentTab &&
      (!genre || s.genre === genre) &&
      (!from || s.addedBy === from) &&
      (!q || [s.title, s.artist, s.note].join(" ").toLowerCase().includes(q))
    );

    if (!shown.length) {
      $("list").innerHTML = `<div class="empty">${songs.length ? "Nothing matches here yet." : "No songs yet — add the first one!"}</div>`;
      return;
    }

    $("list").innerHTML = shown.map(s => {
      const embed = spotifyEmbed(s.spotify);
      const moveLabel = s.section === "favorites" ? "↩ Move to Recommended" : "★ Move to Favorites";
      return `
        <article class="song">
          <div class="song-top">
            <div>
              <h3>${esc(s.title)}</h3>
              <div class="artist">${esc(s.artist)}</div>
            </div>
          </div>
          <div class="tags">
            ${s.genre ? `<span class="tag genre">${esc(s.genre)}</span>` : ""}
            ${s.addedBy ? `<span class="tag">from ${esc(s.addedBy)}</span>` : ""}
          </div>
          ${s.note ? `<p class="note">${esc(s.note)}</p>` : ""}
          <div class="actions">
            ${embed ? `<button class="ghost" data-action="play" data-id="${s.id}">${openPlayers.has(s.id) ? "Hide player" : "▶ Play here"}</button>
                       <a class="spotify" href="${esc(s.spotify)}" target="_blank" rel="noopener">Open in Spotify</a>`
                   : `<a class="spotify" href="https://open.spotify.com/search/${encodeURIComponent(s.title + " " + s.artist)}" target="_blank" rel="noopener">Find on Spotify</a>`}
            <button class="ghost" data-action="move" data-id="${s.id}">${moveLabel}</button>
            <button class="ghost danger" data-action="delete" data-id="${s.id}">Delete</button>
          </div>
          ${embed && openPlayers.has(s.id) ? `<div class="player"><iframe src="${embed}" height="152" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>` : ""}
        </article>`;
    }).join("");
  }

  onSnapshot(query(songsRef, orderBy("createdAt", "desc")), snap => {
    songs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    refreshFromFilter();
    refreshImportBtn();
    render();
  }, err => {
    console.error(err);
    $("list").innerHTML = `<div class="empty">Couldn't load songs — check your Firebase config and Firestore rules.</div>`;
  });
</script>
</body>
</html>
